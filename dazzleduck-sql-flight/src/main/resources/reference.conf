 dazzleduck_server = {
    flight_sql = {
        port = 59307
        host = "0.0.0.0"
        use_encryption = true
        # List of data processor locations advertised to clients.
        # Defaults to the server's own location. Override to point to dedicated worker nodes.
        data_processor_locations = [
            { host = ${dazzleduck_server.flight_sql.host}, port = ${dazzleduck_server.flight_sql.port}, use_encryption = ${dazzleduck_server.flight_sql.use_encryption} }
        ]
        service_name = "dazzleduck-sql-server"
    }

#    http = {
#       port = 8081
#        host = "0.0.0.0"
#       authentication = "none"
#    }

    keystore = "security/server0.key"
    server_cert = "security/server0.pem"
    secret_key = "VGhpcyBpcyBhIDY0IGJpdCBsb25nIGtleSB3aGljaCBzaG91bGQgYmUgY2hhbmdlZCBpbiBwcm9kdWN0aW9uLiBTbyBjaGFuZ2UgbWUgYW5kIG1ha2Ugc3VyZSBpdHMgMTI4IGJpdCBsb25nIG9yIG1vcmU"
    producer_id = "dazzleduck-flight-server"
    # Staging directory for Arrow files written before the Parquet COPY. Resolves to
    # /tmp/dazzleduck-writes on Linux -- unchanged from the previous hardcoded value -- but now
    # follows java.io.tmpdir, so -Djava.io.tmpdir and non-POSIX platforms are honoured. The OTel
    # collector uses the same key and the same default.
    temp_write_location = ${java.io.tmpdir}"/dazzleduck-writes"
    warehouse = ${user.dir}"/warehouse"

    # Open-cursor protection (Flight SQL streaming queries).
    # Each streaming query holds a DuckDB duplicate connection until fully consumed
    # or evicted. Without limits an abandoned-stream attack exhausts server memory.
    cursor_ttl_ms            = 60000   // evict abandoned cursors after 60 s
    max_cursors_per_identity = 50      // max concurrent open cursors per authenticated user
    max_cursors_total        = 2000    // server-wide hard cap; RESOURCE_EXHAUSTED above this

    # Default query timeout in milliseconds. Applied when the client does not specify a timeout.
    query_timeout_ms = 120000 // 2 minutes

    # Maximum query timeout in milliseconds a client is allowed to request.
    # If a client requests a timeout larger than this value the request is rejected.
    # Set to 0 to disable the cap (not recommended for multi-tenant deployments).
    max_query_timeout_ms = 300000 // 5 minutes

    ingestion = {
        min_bucket_size = 1048576 // 1MB
        max_bucket_size = 1073741824 // 1GB
        max_batches = 2048
        max_pending_write = 268435456 // 256 MB
        max_delay_ms = 2000 // 2 sec
        queue_config_refresh_delay_ms = 120000 // 2 min
    }
    users = [{
        username = admin
        password = admin
        groups = [admin, general]
    }]
    jwt_token = {
        expiration = 60m
        claims.generate.headers = [database,schema,x-dd-table,x-dd-filter,x-dd-access,x-dd-path,x-dd-function,x-dd-access-type]
        claims.validate.headers = []
        generation = true
        verify_signature = true
    }

    # Uncomment this  if you want jwt token generation and user/password validation done by external login server
    # This will start proxy all the login/authentication requests to this url
    #login_url = "http://localhost:8080/login"

    # Access mode controls query permissions and external access capabilities
    # Values:
    #   COMPLETE     - Full access to all SQL operations and external tables/functions
    #   READ_ONLY    - Only SELECT queries allowed; no INSERT/UPDATE/DELETE/CREATE/DROP
    #   RESTRICTED   - Only SELECT queries on one table specified in JWT claims
    #
    # External access control:
    # - In COMPLETE mode: All external tables and functions are accessible
    # - In READ_ONLY/RESTRICTED modes: External access controlled by startup script
    #   Use SET enable_external_access=false in startup script to disable external access
    #   This prevents access to external tables/functions (e.g., httpfs, read_json, etc.)
    #
    access_mode = COMPLETE

    startup_script_provider = {
        class = "io.dazzleduck.sql.flight.ConfigBasedStartupScriptProvider"
        content = """
        INSTALL arrow FROM community;
        load arrow;
        """
        # location of the file. If both content and location is provided then content and location are appended to each  other
        # script_location = "/path/to/file.sql"
    }

    # ingestion_task_factory_provider controls what happens after each batch is written.
    #
    # Three implementations are available:
    #
    #   NOOPIngestionTaskFactoryProvider  (default)
    #     Writes Parquet files to disk under ingestion_path/<queue-id>/.
    #     No catalog registration is performed.
    #
    #   DuckLakeIngestionTaskFactoryProvider
    #     Queue-to-table mapping is declared statically in this config file.
    #     Writes Parquet files to the DuckLake table data path and registers each new
    #     file with the DuckLake catalog so it becomes queryable immediately.
    #     Requires ingestion_queue_table_mapping to map queue IDs to catalog tables.
    #     A server restart is required to pick up mapping changes.
    #
    #   DynamicDuckLakeIngestionTaskFactoryProvider
    #     Queue-to-table mapping is stored in a SQLite database.
    #     Queues can be added or removed at runtime without restarting the server.
    #     Polls for changes via PRAGMA data_version every config_load_interval_ms.
    #     Registers each new Parquet file with the DuckLake catalog after ingestion.
    #     The SQLite database also holds a schema_version table that the writer can
    #     use to track remote-sync progress independently of the handler's polling.

    ingestion_task_factory_provider {
        class = io.dazzleduck.sql.commons.ingestion.NOOPIngestionTaskFactoryProvider

        # Root directory where ingested Parquet files are written.
        # Files land at: <ingestion_path>/<queue-id>/<uuid>.parquet
        ingestion_path = ${user.dir}"/warehouse/ingestion"
    }

    # ---- DuckLake provider (uncomment to enable) ----
    #
    # ingestion_task_factory_provider {
    #   class = "io.dazzleduck.sql.commons.ingestion.DuckLakeIngestionTaskFactoryProvider"
    #
    #   # Maps each ingestion queue to a target DuckLake table.
    #   # Every entry must have: ingestion_queue, catalog, schema, table.
    #   ingestion_queue_table_mapping = [
    #     {
    #       # Queue identifier sent by the producer in the ingestion_queue header.
    #       ingestion_queue = "log"
    #
    #       # DuckLake catalog / schema / table that owns the data.
    #       catalog = "loglake"
    #       schema  = "main"
    #       table   = "log"
    #
    #       # Optional: SQL transformation applied to every batch before it is written.
    #       #
    #       # Write a full SELECT statement that references the placeholder table __this.
    #       # At write time the server expands it to:
    #       #
    #       #   WITH __this AS (SELECT * FROM read_parquet([...]) ORDER BY ...)
    #       #   <transformation>
    #       #
    #       # Use cases:
    #       #   - select a subset of columns
    #       #   - rename or cast columns
    #       #   - add derived / enrichment columns
    #       #   - filter rows before persistence
    #       #
    #       # Examples:
    #       #   transformation = "SELECT * FROM __this"                              # no-op (same as omitting)
    #       #   transformation = "SELECT id, ts, msg FROM __this"                   # column subset
    #       #   transformation = "SELECT *, upper(level) AS level FROM __this"      # derived column
    #       #   transformation = "SELECT * FROM __this WHERE level != 'DEBUG'"      # row filter
    #       transformation = "SELECT id, ts, msg, current_timestamp AS ingested_at FROM __this"
    #
    #       # --- View-based transformation (alternative to 'transformation') ---
    #       #
    #       # Instead of writing the transformation SQL by hand, point to an existing DuckLake
    #       # view.  The server reads the view definition at startup (and again every
    #       # queue_config_refresh_delay_ms), replaces the 'input_table' reference with the
    #       # __this CTE placeholder, and uses the result as the transformation.
    #       #
    #       # Both fields must be fully qualified (catalog.schema.name).
    #       # 'view' and 'input_table' are mutually exclusive with 'transformation'.
    #       # Exactly one BASE_TABLE reference matching 'input_table' must exist in the view body.
    #       #
    #       # Example — given:
    #       #   CREATE VIEW loglake.main.v_log_transform AS
    #       #       SELECT ts, upper(level) AS level, msg FROM loglake.main.raw_logs
    #       #
    #       # Config:
    #       #   view        = "loglake.main.v_log_transform"
    #       #   input_table = "loglake.main.raw_logs"
    #       #
    #       # Derived transformation (applied at write time):
    #       #   SELECT ts, upper(level) AS level, msg FROM __this
    #
    #       # Optional: extra key/value pairs forwarded to the post-ingestion task.
    #       additional_parameters = {
    #         key1 = "value1"
    #       }
    #     },
    #     {
    #       ingestion_queue = "metric"
    #       catalog = "loglake"
    #       schema  = "main"
    #       table   = "metric"
    #       # transformation omitted — all columns written as-is
    #     }
    #   ]
    # }

    # ---- DynamicDuckLake provider (uncomment to enable) ----
    #
    # ingestion_task_factory_provider {
    #   class = "io.dazzleduck.sql.commons.ingestion.DynamicDuckLakeIngestionTaskFactoryProvider"
    #
    #   # Path to the SQLite database file that holds the queue registry.
    #   # The file and schema are created automatically on first start.
    #   db_path = "/var/data/ingestion-queues.db"
    #
    #   # How often to poll schema_version.version for changes (milliseconds).
    #   # Default: 5000 (5 seconds).
    #   config_load_interval_ms = 5000
    #
    #   # Optional: when true, the server creates/evolves the DuckLake table for each queue to match
    #   # its transformation output (CREATE on first sight; ADD/DROP COLUMN on change). Columns are
    #   # only added/removed — never re-typed or re-ordered — and tables are never dropped (deleting a
    #   # queue only stops ingestion). The output columns are derived by describing the transformation
    #   # against the raw input columns, so each managed row must set input_schema.
    #   # Default: false.
    #   manage_tables = false
    # }
    #
    # SQLite schema managed by the server (created automatically). The write location and partition
    # columns are derived from the DuckLake table's metadata, not stored here.
    #
    #   CREATE TABLE ingestion_queues (
    #     ingestion_queue  TEXT PRIMARY KEY,   -- queue ID sent by the producer
    #     catalog          TEXT NOT NULL,       -- DuckLake catalog (also used for registration)
    #     schema_name      TEXT NOT NULL,       -- DuckLake schema
    #     table_name       TEXT NOT NULL,       -- DuckLake table
    #     transformation   TEXT,               -- optional SQL referencing __this (see DuckLake provider)
    #     view_name        TEXT,               -- alternative to transformation: fully-qualified view
    #     input_table      TEXT,               -- required when view_name is set
    #     input_schema     TEXT,               -- DuckDB column-def fragment for the __this input columns;
    #                                          --   used only by manage_tables to derive the table columns
    #     partition_by     TEXT,               -- reserved for future use, not read yet
    #     min_bucket_size  INTEGER,            -- reserved, currently unused
    #     max_delay_ms     INTEGER             -- reserved, currently unused
    #   );
    #
    #   CREATE TABLE schema_version (          -- writer-owned; polled by the handler for changes
    #     id      INTEGER PRIMARY KEY CHECK (id = 1),
    #     version INTEGER NOT NULL DEFAULT 0   -- bump atomically with queue changes (also tracks
    #                                          -- remote-sync progress across restarts)
    #   );
    #
    # To add a queue at runtime (no restart needed) — bump schema_version in the same transaction.
    # Set input_schema when manage_tables is enabled so the table's columns can be derived:
    #   BEGIN;
    #   INSERT INTO ingestion_queues (ingestion_queue, catalog, schema_name, table_name, input_schema)
    #   VALUES ('logs', 'loglake', 'main', 'logs', 'timestamp TIMESTAMP, severity_text VARCHAR, body VARCHAR');
    #   UPDATE schema_version SET version = version + 1 WHERE id = 1;
    #   COMMIT;
    #
    # To remove a queue (also bump schema_version):
    #   BEGIN;
    #   DELETE FROM ingestion_queues WHERE ingestion_queue = 'logs';
    #   UPDATE schema_version SET version = version + 1 WHERE id = 1;
    #   COMMIT;


    query_optimizer_provider = {
           class = io.dazzleduck.sql.flight.optimizer.QueryOptimizerProvider
    }
}