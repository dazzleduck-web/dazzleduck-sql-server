name: Native binaries (macOS, Windows)

# Standalone GraalVM native binaries of the otel collector and the compactor for macOS (Apple
# Silicon) and Windows (x64), built on release tags only: macOS and Windows runner minutes cost
# far more than Linux ones, and these are release artifacts, not a PR check. (Pushing or
# force-updating a tag both fire a tag push event, so re-tagging rebuilds them.)
#
# native-image does not cross-compile, so each platform builds on a runner of that platform,
# directly on the host: Docker on these runners builds Linux images, which native-ci.yml and
# release.yml already cover for amd64 and arm64.
#
# Each binary is smoke-tested by starting it and waiting for the same ready line native-ci.yml
# checks, uploaded as a workflow artifact, and attached to the GitHub release for the tag when that
# release already exists. When the release is created later (see RELEASE.md), attach them with
#   gh run download <run-id> -D bins && gh release upload <tag> bins/*/*
#
# Unlike the Linux images, these binaries ship no pre-installed DuckDB extensions: they install
# arrow/ducklake from DuckDB's extension repository on first use, so they need network access
# then. The binaries are not code-signed:
# macOS Gatekeeper blocks a downloaded unsigned binary until its quarantine attribute is cleared
# (xattr -d com.apple.quarantine <file>).
on:
  push:
    tags: ['v*']
  # Also on pull requests that change how these binaries are built, so a change is proven on real
  # macOS and Windows runners before a release depends on it. Nothing is attached to a release then.
  pull_request:
    paths:
      - '.github/workflows/native-binaries.yml'
      - 'dazzleduck-sql-otel-collector/pom.xml'
      - 'dazzleduck-sql-otel-collector/src/main/resources/META-INF/native-image/**'
      - 'dazzleduck-sql-ducklake-compactor/pom.xml'
      - 'dazzleduck-sql-ducklake-compactor/src/main/resources/META-INF/native-image/**'
      - 'dazzleduck-sql-otel-collector/src/main/native-duckdb/**'
      - 'dazzleduck-sql-ducklake-compactor/src/main/native-duckdb/**'
      # The root pom sets duckdb.version: a DuckDB upgrade can change the JNI libraries embedded.
      - 'pom.xml'

concurrency:
  group: native-binaries-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # attach the binaries to the release

jobs:
  native-binary:
    name: ${{ matrix.binary }} (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
        module: [dazzleduck-sql-otel-collector, dazzleduck-sql-ducklake-compactor]
        include:
          - os: macos-14
            platform: macos-arm64
            duckdb_lib: osx_universal # the only macOS lib in the duckdb_jdbc jar
            exe: ''
          - os: windows-latest
            platform: windows-amd64
            duckdb_lib: windows_amd64
            exe: '.exe'
          - module: dazzleduck-sql-otel-collector
            binary: collector
            name: dazzleduck-otel-collector
            startup: 'gRPC server started on port 4317'
            config_prefix: otel_collector
          - module: dazzleduck-sql-ducklake-compactor
            binary: compactor
            name: ducklake-compactor
            config_prefix: dazzleduck_sql_compaction
            # Logged only after the startup script below has run on DuckDB. 'publishing metrics',
            # used before, is logged by telemetry setup before DuckDB is ever touched, so it passed
            # for binaries that could not load DuckDB at all.
            startup: 'Health server listening'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # On Windows, setup-graalvm also sets up the MSVC toolchain native-image links with.
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'maven'

      # -Pnative emits target/<binary>[.exe]. duckdb.native.lib picks the DuckDB lib for this
      # platform out of the duckdb_jdbc jar (the Linux builds default to linux_<arch>).
      - name: Build native binary
        run: |
          ./mvnw -B -ntp -Pnative -pl ${{ matrix.module }} -am -DskipTests package \
            -Dduckdb.native.lib=${{ matrix.duckdb_lib }}
          ls -la ${{ matrix.module }}/target/${{ matrix.binary }}${{ matrix.exe }}

      # Start it and wait for its ready line, so a runtime gap in the reachability metadata
      # (which a build alone would miss) fails the job, as in native-ci.yml.
      - name: Smoke — binary starts
        run: |
          set -uo pipefail
          bin="${{ matrix.module }}/target/${{ matrix.binary }}${{ matrix.exe }}"
          # The ready line must prove DuckDB loads, since the JNI library is what a packaging
          # mistake drops. The collector opens DuckDB before it starts serving; the compactor only
          # does when it has a startup script, so give it one. ${args[@]+...} because macOS
          # runners may use bash 3.2, where an empty array under set -u is an error.
          args=()
          if [ "${{ matrix.binary }}" = compactor ]; then
            args+=("-Ddazzleduck_sql_compaction.startup_script_provider.content=SELECT 42")
          fi
          "$bin" ${args[@]+"${args[@]}"} > smoke.log 2>&1 &
          pid=$!
          ok=no
          for i in $(seq 1 60); do
            if grep -qF "${{ matrix.startup }}" smoke.log; then ok=yes; break; fi
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          echo "--- binary output ---"; tail -30 smoke.log
          kill "$pid" 2>/dev/null || true
          [ "$ok" = yes ] || { echo "::error::${{ matrix.binary }} (${{ matrix.platform }}) did not reach '${{ matrix.startup }}'"; exit 1; }

      # A DuckDB error must reach Java as an exception. DuckDB's JNI code raises it with ThrowNew,
      # which needs the exception's (String) constructor registered in jni-config.json; without it
      # the binary dies with a NoSuchMethodError instead, on any bad SQL or failed COPY. A startup
      # script reading a missing table makes DuckDB fail before anything else runs.
      - name: Smoke — a DuckDB error is an exception
        run: |
          set -uo pipefail
          bin="${{ matrix.module }}/target/${{ matrix.binary }}${{ matrix.exe }}"
          "$bin" "-D${{ matrix.config_prefix }}.startup_script_provider.content=SELECT * FROM dd_smoke_missing_table" > error.log 2>&1 &
          pid=$!
          for _ in $(seq 1 60); do
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          kill "$pid" 2>/dev/null || true
          echo "--- binary output ---"; tail -40 error.log
          if grep -q "NoSuchMethodError" error.log; then
            echo "::error::${{ matrix.binary }} (${{ matrix.platform }}): a DuckDB error crashed with NoSuchMethodError instead of reaching Java as an exception (see jni-config.json)"; exit 1
          fi
          grep -qF "Table with name dd_smoke_missing_table does not exist" error.log || {
            echo "::error::${{ matrix.binary }} (${{ matrix.platform }}) did not report DuckDB's error"; exit 1; }

      - name: Package
        id: package
        run: |
          set -euo pipefail
          # A tag names the version; a pull-request run has no version, so name it by commit.
          if [ "${GITHUB_REF_TYPE}" = tag ]; then version="${GITHUB_REF_NAME#v}"; else version="pr-${GITHUB_SHA::8}"; fi
          base="${{ matrix.name }}-${version}-${{ matrix.platform }}"
          mkdir -p dist
          cp "${{ matrix.module }}/target/${{ matrix.binary }}${{ matrix.exe }}" dist/
          if [ "${{ matrix.exe }}" = ".exe" ]; then
            (cd dist && 7z a -bd "../${base}.zip" "${{ matrix.binary }}.exe" > /dev/null)
            echo "file=${base}.zip" >> "$GITHUB_OUTPUT"
          else
            tar -czf "${base}.tar.gz" -C dist "${{ matrix.binary }}"
            echo "file=${base}.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-${{ matrix.platform }}
          path: ${{ steps.package.outputs.file }}
          if-no-files-found: error

      # --clobber replaces the asset when a tag is re-pushed.
      - name: Attach to the GitHub release, if it exists
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${{ steps.package.outputs.file }}" --clobber
          else
            echo "::notice::No release for $GITHUB_REF_NAME yet; the binary is in this run's artifacts."
          fi
