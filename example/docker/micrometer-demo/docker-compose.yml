# Micrometer Metrics Forwarder Demo with DuckLake
#
# Run from dazzleduck-sql-examples/docker/micrometer-demo directory:
#   docker-compose up
#
# Prerequisites:
#   Build the Docker image first:
#   ./mvnw clean install -DskipTests && ./mvnw generate-resources jib:dockerBuild -pl dazzleduck-sql-runtime -Dducklake.extension.download.skip=false
#
# Query metrics after running:
#   SELECT * FROM ollylake.main.metric ORDER BY timestamp DESC LIMIT 100;

services:
  dazzleduck-server:
    image: dazzleduck/dazzleduck:latest
    container_name: dazzleduck-server
    ports:
      - "8081:8081"
      - "59307:59307"
    working_dir: /workspace
    volumes:
      - warehouse-data:/workspace/warehouse
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /workspace/warehouse/metadata/ollylake /workspace/warehouse/data/ollylake/main/metric && \
        exec /app/entrypoint.sh "$$@"
    command:
      - --conf
      - dazzleduck_server.startup_script_provider.class=io.dazzleduck.sql.flight.LocalStartupConfigProvider
      - --conf
      - dazzleduck_server.startup_script_provider.script_location=/startup/ollylake.sql
      - --conf
      - dazzleduck_server.ingestion_task_factory_provider.class=io.dazzleduck.sql.commons.ingestion.DuckLakeIngestionTaskFactoryProvider
      - --conf
      - 'dazzleduck_server.ingestion_task_factory_provider.ingestion_queue_table_mapping=[{transformation: "SELECT *,CAST(timestamp AS DATE) AS date FROM __this", ingestion_queue: metric, table: metric, schema: main, catalog: ollylake}]'
      - --conf
      - dazzleduck_server.jwt_token.verify_signature=false

    networks:
      - dazzleduck-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  micrometer-demo:
    image: dazzleduck/dazzleduck:latest
    container_name: micrometer-demo
    command: ["io.dazzleduck.sql.micrometer.demo.Demo"]
    environment:
      - DAZZLEDUCK_BASE_URL=http://dazzleduck-server:8081
      - DAZZLEDUCK_USERNAME=admin
      - DAZZLEDUCK_PASSWORD=admin
      - DAZZLEDUCK_INGESTION_QUEUE=metric
    depends_on:
      dazzleduck-server:
        condition: service_healthy
    networks:
      - dazzleduck-net
    restart: on-failure

volumes:
  warehouse-data:

networks:
  dazzleduck-net:
    driver: bridge
    name: dazzleduck-micrometer-demo-network
