dazzleduck_sql_compaction {
  # List of DuckLake catalog names (must be attached via startup_script)
  databases = []

  # Each tier is a self-contained compaction level: its own schedule, its own file-size range, its
  # own file-count cap, and its own DuckDB connection settings. Any number of tiers is allowed, as
  # long as every ENABLED tier's [min_file_size, max_file_size) range is disjoint from every other's
  # — validated at startup (CompactionConfig refuses to start on overlapping ranges or duplicate
  # names). That disjointness is what lets tiers run concurrently with no lock: each only ever
  # touches its own files, so two tiers can never race on the same ones.
  #
  # min_file_size is always required, including 0 for the lowest tier — every tier passes both
  # bounds to ducklake_merge_adjacent_files unconditionally, so there's no ambiguity about which end
  # of the range is unbounded. max_compacted_files caps how many files one cycle merges (passed
  # through as that same procedure's own max_compacted_files parameter); 0 = unbounded, matching its
  # default of merging every eligible file in the tier's range in one call — on a large catalog that
  # can turn one cycle into a long-running transaction with a memory footprint proportional to the
  # whole range rather than to a bounded batch. connection_settings are raw SQL run on that tier's
  # connection right after opening it (e.g. to set memory_limit/threads differently per tier) — same
  # mechanism ConnectionPool.getConnection(List<String>) already uses for JWT-scoped connections.
  #
  # The shipped default disables DuckDB's external-file cache, an in-memory LRU over external
  # Parquet DATA (not just footers). A merge reads each source file exactly once and then retires
  # it, so the cache can never hit and only accumulates memory - and it is NOT bounded by
  # memory_limit, so it will grow past whatever limit the tier sets. Measured on a benchmark
  # compactor: 14.8 GiB RSS against a 12 GB memory_limit in ~44 min, versus ~0.7 GiB flat with it
  # off, at identical cycle duration. Note HOCON replaces a list wholesale rather than merging it,
  # so a compaction_tiers block of your own must repeat this setting to keep it.
  compaction_tiers = [
    {
      name = "minor"
      enabled = true
      frequency = 1 minute
      min_file_size = 0
      max_file_size = 8MB
      max_compacted_files = 1000
      connection_settings = ["SET enable_external_file_cache = false"]
      # e.g. add "SET memory_limit='2GB'", "SET threads=2"
    }
    {
      name = "major"
      enabled = true
      frequency = 1 hour
      min_file_size = 8MB
      max_file_size = 64MB
      max_compacted_files = 1000
      connection_settings = ["SET enable_external_file_cache = false"]
      # e.g. add "SET memory_limit='8GB'", "SET threads=4"
    }
  ]

  # How often to run housekeeping: expire old snapshots and delete orphaned S3 files.
  # Decoupled from compaction so S3 cleanup happens frequently without forcing a full merge.
  housekeeping_frequency = 5 minutes

  # Raw SQL run on housekeeping's connection right after opening it — independent of any tier's
  # connection_settings (housekeeping isn't a tier and isn't tied to one).
  housekeeping_connection_settings = ["SET enable_external_file_cache = false"]

  # Snapshots and files older than this are expired and deleted during housekeeping
  snapshot_retention = 15 minutes

  # Port for the embedded health check HTTP server (GET /health)
  health_port = 8080

  # Exports this service's meters to an OpenTelemetry collector over OTLP gRPC.
  metrics {
    # Off by default. While false the meters go to the log registry instead, so a compactor
    # deployed without a collector does not log a failed export every interval.
    # Setting this true also requires `token` (see below) — the service fails fast on startup
    # otherwise, since the collector rejects every unauthenticated export.
    enabled = false
    enabled = ${?DD_METRICS_ENABLED}

    # The collector's OTLP gRPC receiver — otel_collector.grpc_port, 4317 by default. Note this
    # is NOT the collector's health port, which defaults to 8081.
    endpoint = "http://localhost:4317"
    endpoint = ${?DD_METRICS_OTLP_ENDPOINT}

    # Matched to the most frequent tier's cadence — a shorter interval exports unchanged values.
    export_interval = 1 minute

    request_timeout = 10 seconds

    # Required. The collector authenticates every RPC and reads the target queue from the token's
    # x-dd-ingestion-queue claim; there is no fallback, so a token without it is rejected with
    # INVALID_ARGUMENT. The claim must name a queue in ingestion_queue_table_mapping.
    token = ${?DD_METRICS_OTLP_TOKEN}

    # Reported as the service.name resource attribute.
    service_name = "ducklake-compactor"
  }

  # SQL executed once on startup (use to ATTACH databases, load extensions, etc.)
  # Supports any StartupScriptProvider via the 'class' key (default: ConfigBasedStartupScriptProvider).
  startup_script_provider {
    # class = io.dazzleduck.sql.flight.LocalStartupConfigProvider
    # script_location = "/config/startup.sql"
    # content = "ATTACH '...' AS mydb (DATA_PATH '...');"
  }
}
