dazzleduck_sql_compaction {
  # List of DuckLake catalog names (must be attached via startup_script)
  databases = []

  # Each tier is a band of file sizes [min_file_size, max_file_size) with its own target, limits
  # and DuckDB instance. Tiers are chained: a merge writes files of about target_file_size, which
  # land in the next band up, and files of the last band's max or more are final. Any number of tiers
  # is allowed, as long as enabled tiers' bands do not overlap (checked at startup).
  #
  # Each enabled (database, tier) runs one loop thread (DYNAMIC_COMPACTION_SPEC.md, Phase 1). A pass
  # lists the tables with work in one catalog query, then merges them one table at a time, each in
  # one transaction with one commit:
  #
  #   CALL ducklake_merge_adjacent_files(db, table, schema := ..., min_file_size := ...,
  #        max_file_size := ..., max_compacted_files := <cap>)
  #
  # Settings per tier (sizes in HOCON bytes, where MB = 10^6 and MiB = 2^20):
  #   target_file_size     required. ducklake_target_file_size is SET on the session before every
  #                        call, overriding table and catalog options, so a merge group never grows
  #                        to DuckLake's 512 MB default. Must be at least max_file_size: DuckLake skips
  #                        a file as large as the target. Needs DuckDB 1.5.4 or later; a tier whose
  #                        SET fails does not start.
  #   max_compacted_files  the static cap: the most groups (output files) one call merges. A call
  #                        gets less when its groups are many small files (max_files_per_call), or
  #                        would run past call_time_limit, or 80% of the catalog's
  #                        idle_in_transaction_session_timeout; at least busy partitions + 1 within
  #                        those, so one busy partition cannot take every slot.
  #   max_files_per_call   the most input files a call is sized to merge (default 6000, about 4.5 min)
  #   call_time_limit      the longest a call is sized to run (default 10 minutes)
  #   min_files, max_wait  a table is merged once one of its groups has min_files files (default 2),
  #                        or its second-oldest file has waited max_wait (default: no time trigger)
  #   pass_time_limit      after this, a pass starts no new call; the rest go first next pass
  #                        (default 2 minutes)
  #   idle_sleep_max       sleep after a pass that found no work (default 10 seconds)
  #   cpu_share            share of the process's CPUs and memory for this tier. Each database runs
  #                        its own instance of every tier, so the share is divided among them: each
  #                        instance gets threads = 2 x its CPUs and, unless connection_settings sets
  #                        one, memory_limit = 50% of the process's memory x its share. Shares add up
  #                        to at most 1; a tier without one gets an equal part of the rest.
  #   connection_settings  raw SQL run on the tier's connection after it opens. A `SET threads` or
  #                        `SET memory_limit` here overrides the one cpu_share computes.
  #
  # The shipped settings disable DuckDB's external-file cache, an in-memory LRU over external
  # Parquet DATA (not just footers). A merge reads each source file exactly once and then retires
  # it, so the cache can never hit and only accumulates memory - and it is NOT bounded by
  # memory_limit. Measured on a benchmark compactor: 14.8 GiB RSS against a 12 GB memory_limit in
  # ~44 min, versus ~0.7 GiB flat with it off.
  #
  # Tiers are keyed by name rather than listed, because HOCON merges objects field-by-field but
  # replaces lists wholesale. Keyed, a single setting can be retuned without restating the tier:
  #
  #   --conf 'dazzleduck_sql_compaction.compaction_tiers.minor.max_compacted_files = 8'
  #
  # `frequency`, the timer of earlier releases, is no longer used and may be left in a config.
  compaction_tiers {
    minor {
      enabled = true
      min_file_size = 0
      max_file_size = 8MB
      target_file_size = 16MB
      max_compacted_files = 12
      # Any two files merge, so without a threshold a slow table would rewrite its leftover file on
      # almost every pass. Timed on a group's second-oldest file, so a new file waits at most 5 min.
      min_files = 4
      max_wait = 5 minutes
      cpu_share = 0.5
      connection_settings = ["SET enable_external_file_cache = false"]
      # e.g. add "SET memory_limit='2GB'"
    }
    major {
      enabled = true
      min_file_size = 8MB
      max_file_size = 64MB
      target_file_size = 64MB
      max_compacted_files = 16
      cpu_share = 0.25
      connection_settings = ["SET enable_external_file_cache = false"]
    }
    mega {
      enabled = true
      min_file_size = 64MB
      max_file_size = 256MB
      target_file_size = 256MB
      max_compacted_files = 5
      cpu_share = 0.25
      connection_settings = ["SET enable_external_file_cache = false"]
    }
  }

  # How often to run housekeeping: expire old snapshots and delete orphaned S3 files.
  # Decoupled from compaction so S3 cleanup happens frequently without forcing a full merge.
  housekeeping_frequency = 5 minutes

  # Raw SQL run on housekeeping's connection right after opening it — independent of any tier's
  # connection_settings (housekeeping isn't a tier and isn't tied to one).
  housekeeping_connection_settings = ["SET enable_external_file_cache = false"]

  # Snapshots and files older than this are expired and deleted during housekeeping
  snapshot_retention = 15 minutes

  # Delete-file cleanup: each housekeeping cycle first runs ducklake_rewrite_data_files, which rewrites
  # data files with enough deleted rows so their delete files are dropped. The replaced files are then
  # expired and deleted like any other retired file.
  rewrite_deletes_enabled = true
  # Fraction (0-1) of a file's rows that must be deleted before it is rewritten. Leave unset to use the
  # catalog's rewrite_delete_threshold option, which DuckLake defaults to 0.95.
  # rewrite_delete_threshold = 0.5

  # Data retention: deletes the data files whose rows are all older than each table's retention, as
  # listed in a policy table. The cutoff now() - <retention> is lowered to a file boundary read from
  # the catalog's min/max statistics, and one DELETE FROM <table> WHERE <time_column> < <boundary> drops
  # whole files - no delete files, nothing rewritten, except in files holding NULL times or without
  # statistics for the column. Rows straddling the cutoff wait for a later cycle. The dropped files are removed by housekeeping once they fall out of snapshot_retention.
  # The policy table (or a view) is read on every cycle, so changes apply without a restart:
  #
  #   CREATE TABLE lake.main.retention_policy (
  #     table_name  VARCHAR,  -- catalog.schema.table; the catalog must be one of `databases`
  #     time_column VARCHAR,  -- DATE or TIMESTAMP column that is the row's age (UTC); NULL rows are kept
  #     retention   VARCHAR   -- a number and a unit ('30 days', '12h', '2w'), or 'unlimited';
  #                             -- a bare number or 'm' is rejected
  #   );
  #
  # Without the duckdb/ducklake#1895 fix (DuckLake patch v1.5.6-dazzleduck.3 or later) every such
  # DELETE conflicts with any concurrent insert into the table, so under continuous ingestion it
  # keeps failing and is only retried on the next cycle. An ingesting process on stock DuckLake can
  # still, rarely, fail a batch whose registration is open when the DELETE commits (see the README).
  data_retention {
    enabled = false
    frequency = 1 hour
    # policy_table = "lake.main.retention_policy"
    connection_settings = ["SET enable_external_file_cache = false"]
    # The most data files one table's DELETE drops in a cycle (0 = no cap), so a long backlog drains
    # over several cycles instead of one transaction that outlasts the catalog's idle timeout.
    max_files_per_cycle = 1000
  }

  # Port for the embedded HTTP server: GET /health (JSON) and GET /ui (per-cycle telemetry dashboard)
  health_port = 8080

  # Per-call compaction telemetry. Capture only.
  # In-memory ring buffer depth per (database, tier): its latest table calls, shown on /ui and used
  # for derived aggregates.
  run_history_size = 50
  # Note: the whole-catalog per-tier file-count gauges refresh on a fixed 2-minute cadence, off the
  # compaction path (not configurable — an internal gauge-maintenance interval).
  # Note: the catalog's idle_in_transaction_session_timeout is read from Postgres when each tier's
  # connection opens (so an ATTACH "options=-c idle_in_transaction_session_timeout=600000" counts). It
  # sizes calls and is the durationHeadroom denominator. A tier does not start only if not even two of
  # its smallest files fit in a group within 80% of it (or of its memory_limit); otherwise its calls
  # run with a lowered target when a full group does not fit. 0 (Postgres's default) or a
  # SQLite/DuckDB catalog: no limit.

  # Exports this service's meters to an OpenTelemetry collector over OTLP gRPC.
  metrics {
    # Off by default. While false the meters go to the log registry instead, so a compactor
    # deployed without a collector does not log a failed export every interval.
    # Setting this true also requires `token` (see below) — the service fails fast on startup
    # otherwise, since the collector rejects every unauthenticated export.
    enabled = false
    enabled = ${?DD_METRICS_ENABLED}

    # The collector's OTLP gRPC receiver — otel_collector.grpc_port, 4317 by default. Note this
    # is NOT the collector's health port, which defaults to 8081.
    endpoint = "http://localhost:4317"
    endpoint = ${?DD_METRICS_OTLP_ENDPOINT}

    # Matched to the most frequent tier's cadence — a shorter interval exports unchanged values.
    export_interval = 1 minute

    request_timeout = 10 seconds

    # Required. The collector authenticates every RPC and reads the target queue from the token's
    # x-dd-ingestion-queue claim; there is no fallback, so a token without it is rejected with
    # INVALID_ARGUMENT. The claim must name a queue in ingestion_queue_table_mapping.
    token = ${?DD_METRICS_OTLP_TOKEN}

    # Reported as the service.name resource attribute, for logs as well as metrics.
    service_name = "ducklake-compactor"
  }

  # Ships this service's log lines (SLF4J/Logback) to the collector as OTLP log records.
  # Independent of metrics: either can be on without the other.
  logs {
    # Off by default. true also requires `token`; the service fails fast otherwise.
    enabled = false
    enabled = ${?DD_LOGS_ENABLED}

    # Same collector as metrics unless set here. Left unset rather than written as a HOCON
    # substitution, which would freeze the file default before --conf overrides are merged.
    endpoint = ${?DD_LOGS_OTLP_ENDPOINT}

    # Also defaults to the metrics value.
    # request_timeout = 10 seconds

    # Required. Log and metric queues have different schemas, so this must be a DIFFERENT token
    # from metrics.token: one whose x-dd-ingestion-queue claim names a log queue.
    token = ${?DD_LOGS_OTLP_TOKEN}

    # Minimum level shipped (TRACE, DEBUG, INFO, WARN, ERROR). Console output is unaffected.
    level = INFO
    level = ${?DD_LOGS_LEVEL}
  }

  # SQL executed once on startup (use to ATTACH databases, load extensions, etc.)
  # Supports any StartupScriptProvider via the 'class' key (default: ConfigBasedStartupScriptProvider).
  startup_script_provider {
    # class = io.dazzleduck.sql.flight.LocalStartupConfigProvider
    # script_location = "/config/startup.sql"
    # content = "ATTACH '...' AS mydb (DATA_PATH '...');"
  }
}
