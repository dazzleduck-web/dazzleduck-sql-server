otel_collector {
    grpc_port = 4317

    # Directory under which each signal service creates its private scratch directory
    # (otel-logs-arrow-*, otel-traces-arrow-*, otel-metrics-arrow-*) for the temporary
    # uncompressed Arrow batch files staged before the Parquet COPY. Same key, meaning and default
    # as the flight module's temp_write_location (/tmp/dazzleduck-writes on Linux). Created at
    # startup if absent. Files are deleted as soon as their batch is written; the directories are
    # removed on shutdown. Steady-state usage is roughly ingestion.min_bucket_size per active
    # queue plus in-flight batches, but the Arrow staging files are uncompressed and so larger
    # than the Parquet they become -- point this at a real data volume if the default is a small
    # tmpfs.
    temp_write_location = ${java.io.tmpdir}"/dazzleduck-writes"

    # Embedded HTTP server on this port serves:
    #   GET /health  — 200 while HEALTHY; 503 during MAINTENANCE (graceful-shutdown drain) and DOWN.
    #   GET /stats   — auto-refreshing HTML dashboard of per-queue ingestion stats (rows, bytes,
    #                  pending/backpressure, failures, 429 / out-of-sequence / multi-partition
    #                  rejections, write latency, freshness, and last-15-minute rows/min +
    #                  arrivals/min sparklines), with a row per partition sub-queue.
    health {
        port = 8081
        # Time to stay in MAINTENANCE (serving 503 on /health) before stopping the gRPC server, so a
        # readiness probe / load balancer can stop routing first. A small LB-drain window; in-flight
        # batches are flushed by the gRPC awaitTermination window, not by this. Set 0 to skip it.
        shutdown_grace_period_ms = 2000
    }

    metrics {
        # Write each metric's OTLP description into the `description` column. Off by default: the
        # description repeats on every data point, and with many distinct metrics Parquet stops
        # dictionary-encoding it, so it is stored in full on every row. When off, the column is
        # kept but written as NULL, so existing tables and queries still work.
        write_description = false
    }

    # Attributes (and resource attributes) are written to one map per OTLP value type:
    #   attributes          MAP(VARCHAR, VARCHAR)  string values
    #   attributes_int      MAP(VARCHAR, BIGINT)
    #   attributes_double   MAP(VARCHAR, DOUBLE)
    #   attributes_bool     MAP(VARCHAR, BOOLEAN)
    #   attributes_bytes    MAP(VARCHAR, BLOB)
    #   attributes_json     MAP(VARCHAR, JSON)     arrays and key/value lists, as typed JSON
    # and likewise resource_attributes_*, and the attributes of span events and links.
    attributes {
        # Also write every non-string value, as text, to the string map (`attributes`), so one
        # lookup finds any key whatever its type and queries written against the string-only schema
        # keep working. Costs storing those values twice. When false, the string map holds only
        # string values (and attributes with no value set, as '').
        string_copy = true
    }

    # Which OTLP value types each attribute name has arrived with, recorded in an append-only table.
    # An attribute sent as a string by one release of a service and as an int by the next moves its
    # values from `attributes` to `attributes_int`; without this, finding that name means searching
    # every map. One row per (ingestion_queue, signal, attribute_scope, attribute_name, value_type),
    # with first_seen and the collector that wrote it. Types are recorded, never enforced: a type
    # change is written down, not rejected.
    #
    #   CREATE TABLE <attribute_types_table> (
    #       ingestion_queue VARCHAR NOT NULL,
    #       signal          VARCHAR NOT NULL,   -- logs | traces | metrics
    #       attribute_scope VARCHAR NOT NULL,   -- attribute | resource | event | link
    #       attribute_name  VARCHAR NOT NULL,
    #       value_type      VARCHAR NOT NULL,   -- string | int | double | bool | bytes | array
    #                                           -- | kvlist | empty
    #       first_seen      TIMESTAMP WITH TIME ZONE NOT NULL,
    #       collector_id    VARCHAR);
    #
    # WHICH STREAMS RECORD, AND WHERE, IS SET PER QUEUE: a queue records only if its mapping sets
    # `attribute_types_table` (above), exactly like `watermark_table`. The name is unqualified and
    # resolved in that queue's own catalog and schema, so the table sits beside the signal tables
    # and can be joined to them. It and its data directory are created AT STARTUP (CREATE TABLE IF
    # NOT EXISTS, before the gRPC server accepts traffic) and startup FAILS if they cannot be — an unattached catalog, a
    # missing schema, a name already taken — rather than letting every batch of that stream fail at
    # commit once traffic arrives. Streams sharing a schema may share one
    # table or have one each. Nothing here names a catalog, and nothing could: with a dynamic queue
    # registry the collector does not know a queue's schema until a batch arrives. NOT available for
    # queues registered via the dynamic SQLite provider, which stores no additional_parameters.
    #
    # Rows reach the table the way data does: written as a Parquet file and registered, never
    # inserted. The file is COPYed before the transaction and registered by the SAME transaction
    # that registers that batch's data files, so a registered data file always has its mappings
    # committed. One small file per FIRST appearance of a mapping — none in steady state — merged by
    # ordinary compaction. The trade-off of that atomicity: a statement the database rejects fails
    # the batch, where a background writer would have retried it. DuckLake queues only — a
    # plain-Parquet queue has no transaction to join, and its mappings are counted as dropped.
    #
    # APPEND-ONLY, AND DUPLICATES ARE TOLERATED. A write reads, updates and deletes nothing, so it
    # cannot conflict with another process appending the same value and adds no scan to the
    # transaction — several collectors recording the same mapping produce several identical rows.
    # Deduplicate when reading (GROUP BY the five key columns, min(first_seen)). Within a process,
    # repeats are kept down by a cache it builds at startup from the tables its own queues record
    # into, so a restart does not re-append what it already recorded.
    #
    # The current type of each attribute:
    #   SELECT ingestion_queue, signal, attribute_scope, attribute_name,
    #          arg_max(value_type, first_seen) AS current_type
    #   FROM <attribute_types_table> GROUP BY ALL;
    # The ones that have had more than one:
    #   SELECT attribute_name, list(value_type) AS types FROM <attribute_types_table>
    #   GROUP BY ALL HAVING count(*) > 1;
    attribute_types {
        # Honour the per-queue `attribute_types_table` parameters at all. Set false to turn the
        # registry off everywhere without editing each queue; a queue that names no table is off
        # either way, and is not even scanned.
        enabled = true
        # Cap on mappings held in memory, across every queue. Past it new ones are counted
        # (otel.attribute_types.dropped) and logged, but not recorded — which bounds attribute
        # names that embed ids. The cache is built for thousands of streams in one process: one
        # entry per stream and signal, one per attribute name within it with a bitmask over the
        # (scope, type) pairs seen, and one shared instance of each name across all streams — so a
        # name's further scopes and types cost no memory, and a name common to every stream is
        # stored once.
        max_entries = 100000

        # And a cap per stream, which is the one that makes a bad producer diagnosable. The global
        # cap alone punishes the wrong streams: one queue whose attribute NAMES embed ids
        # (user.8f21ac.action) consumes the whole budget, and every other queue then silently stops
        # recording new mappings. This contains the damage to the queue causing it, and because
        # otel.attribute_types.dropped is tagged with the queue, it names that queue. A queue may
        # set its own with attribute_types_max_entries, but cannot exceed max_entries, which stays
        # the heap bound.
        max_entries_per_stream = 10000
    }

    # A local SQL endpoint on the collector's own DuckDB instance, for testing: GET /v1/query?q=<sql>
    # or POST /v1/query {"query": "..."}, answering TSV, JSON Lines or Arrow IPC by Accept header, like
    # the main server's /v1/query. Only a single SELECT is accepted (checked with DuckDB's parser) and
    # it runs in a read-only transaction. That is not a security boundary (a SELECT can still call a
    # table function with side effects), and there is no authentication - hence localhost by
    # default. Off unless enabled.
    query {
        enabled = false
        host = "127.0.0.1"
        port = 8082
        threads = 4               # request threads, also the limit on concurrent queries
        timeout = 30 seconds      # execution still running after this is cancelled (504); whole seconds,
                                  # at least 1. Streaming a result is not time-limited.
        arrow_batch_size = 10000
    }

    # DuckLake maintenance run inside the collector, on the collector's own DuckDB instance (the one
    # the startup script attaches catalogs to), so it works with DuckDB-file and SQLite catalogs that
    # can only be attached once per process. It shares that instance's memory_limit and threads with
    # ingestion. All jobs run on one thread and never overlap. Off unless enabled.
    compaction {
        enabled = false
        # Attached DuckLake catalog names to maintain. Required when enabled.
        catalogs = []

        # Merge files smaller than max_file_size.
        minor {
            frequency = 1 minute
            max_file_size = 8MB
        }

        # Flush inlined data, expire snapshots older than snapshot_retention, merge all sizes, rewrite
        # data files with deleted rows, and delete files retired longer ago than snapshot_retention.
        major {
            frequency = 1 hour
            snapshot_retention = 15 minutes
            # Fraction (0-1) of a file's rows that must be deleted before it is rewritten. Unset uses
            # the catalog's rewrite_delete_threshold option (DuckLake default 0.95).
            # rewrite_delete_threshold = 0.3
        }

        # Delete files under the catalog's data path that it does not reference. Off by default. A
        # batch's file is unreferenced until the collector registers it, so older_than must exceed the
        # longest possible write-to-register delay; values under 1 hour are rejected.
        orphan_cleanup {
            enabled = false
            frequency = 1 day
            older_than = 2 days
        }
    }

    # SQL executed once on startup (on the singleton DuckDB connection).
    # 'content'         — inline SQL, executed first.
    # 'script_location' — path to a .sql file, appended after content.
    # Startup fails if the script cannot be produced: an unknown 'class', a script_location that is
    # not a readable file, or an undefined ${ENV} reference in it.
    startup_script_provider {
        content = """
        INSTALL arrow FROM community;
        LOAD arrow;
        """
        # script_location = "/path/to/startup.sql"
    }

    # -------------------------------------------------------------------------
    # Queue tuning — shared across all signal writers (logs, traces, metrics).
    # Mirror of the flight module's ingestion block.
    # -------------------------------------------------------------------------
    ingestion {
        min_bucket_size              = 1048576   # 1 MB — flush when accumulated Arrow bytes reach this
        max_delay_ms                 = 5000      # flush after this many ms even if below min_bucket_size
        # How often DuckLakeIngestionHandler refreshes queue state is NOT set here: it is
        # queue_config_refresh_delay_ms inside the ingestion_task_factory_provider block below,
        # which is the block the provider reads.

        # Parquet codec for ingestion writes: uncompressed|snappy|gzip|zstd|brotli|lz4|lz4_raw.
        parquet_compression = snappy

        # Raw SQL applied to the ingestion DuckDB instance at startup.
        #
        # enable_external_file_cache is an in-memory LRU over external file DATA. The ingest
        # path stages each batch to an Arrow file, reads it exactly once via read_arrow([...])
        # and then deletes it, so the cache can never hit and only costs memory. It is also not
        # bounded by memory_limit. Set to [] to restore DuckDB's default, or add your own SETs.
        connection_settings = ["SET enable_external_file_cache = false"]
    }

    # -------------------------------------------------------------------------
    # Ingestion provider — controls post-batch behavior for all signal queues.
    #
    # Three implementations:
    #
    #   (default — no class set)
    #     Queue mapping declared inline below. Writes Parquet files to output_path.
    #     No DuckLake catalog registration.
    #
    #   DuckLakeIngestionTaskFactoryProvider
    #     Queue mapping declared inline. Registers each Parquet file with the DuckLake
    #     catalog after writing. Requires catalog/schema/table on every entry.
    #     A server restart is required to pick up mapping changes.
    #
    #   DynamicDuckLakeIngestionTaskFactoryProvider
    #     Queue mapping stored in a SQLite database — add/remove queues at runtime
    #     without restarting. Polls PRAGMA data_version every config_load_interval_ms.
    #     Registers each Parquet file with the DuckLake catalog after writing.
    #     See the flight module reference.conf for the full SQLite schema reference.
    #
    # If this block is present but fails to load or validate, startup fails rather than silently
    # falling back to plain Parquet without catalog registration.
    # -------------------------------------------------------------------------
    ingestion_task_factory_provider {
        # ---- Static DuckLake provider (uncomment class to enable) ----
        # class = "io.dazzleduck.sql.commons.ingestion.DuckLakeIngestionTaskFactoryProvider"
        #
        # How often each queue's state is re-read from the catalog: target path, partition
        # columns, a view-derived transformation, and per-queue session variables. Default when
        # omitted: 2 min. This is the only copy of the key that is read.
        # queue_config_refresh_delay_ms = 120000
        # A failed write also re-reads the catalog at once and, if the partitioning or
        # transformation changed, retries the batch once under the new state.

        # ---- Dynamic SQLite provider (mutually exclusive with the mapping below) ----
        # class = "io.dazzleduck.sql.commons.ingestion.DynamicDuckLakeIngestionTaskFactoryProvider"
        # db_path = "/var/data/ingestion-queues.db"
        # config_load_interval_ms = 5000

        ingestion_queue_table_mapping = [
            {
                ingestion_queue = "logs"
                output_path     = "./otel-logs"
                # transformation  = "CAST(timestamp AS DATE) AS date, severity_text AS level"
                # min_bucket_size = 1048576
                # max_delay_ms    = 5000
                # Split into N hash-routed sub-queues (parallel writers, each with its own backpressure:
                # up to num_partitions x max_pending_write bytes pending before a 429), all writing into
                # output_path, which must already exist. Partition = hash(partition_expression) % num_partitions over the raw
                # rows; a batch whose rows span more than one partition is REJECTED. See the flight
                # reference.conf for the full description.
                # num_partitions       = 4
                # partition_expression = "resource['user_id']"   # map/struct field on the flattened OTLP row
                # partition_expression = "claims['user_id']"     # or a JWT claim (extract_claims stamps this column)
                # Stamp caller JWT claims onto rows. PRIVACY note + DDL: README "JWT Claims Column".
                # extract_claims = true
                # Optional: DuckDB session variables for this queue, set on the connection that
                # writes its batches, so the transformation reads one with getvariable('name')
                # instead of carrying it as a literal — with env = "prod" below:
                #   transformation = "CAST(timestamp AS DATE) AS date, getvariable('env') AS env"
                # Static pairs are read once at startup. A key/value relation is re-read on every
                # queue_config_refresh_delay_ms of THIS block, so a value changes without a
                # restart; it holds this queue's own variables (give each queue its own view), and
                # it wins where both sources define a name. Every value is applied as VARCHAR, so
                # cast where another type is meant: getvariable('retention_days')::INT.
                # With variables_expiration_column set, a row whose expiration has passed is
                # treated as absent — the variable is no longer set, so the transformation reads
                # the static value for that name or NULL; a NULL expiration never expires.
                # Needs the DuckLake provider and this entry's catalog/schema/table: an entry with
                # only an output_path is not registered by the provider and gets no variables.
                # See the flight reference.conf for the full description.
                # variables { env = "prod", retention_days = "30" }
                # variables_view              = "my_catalog.main.v_logs_vars"
                # variables_key_column        = "key"             # default
                # variables_value_column      = "value"           # default
                # variables_expiration_column = "expires_at"      # optional
                # DuckLake fields (required when class is set):
                # catalog = "my_catalog"
                # schema  = "main"
                # table   = "logs"
                # Optional watermark append — one MIN/MAX/COUNT row per group is computed
                # at WRITE time (from the same relation the output Parquet is written from)
                # and inserted in the SAME transaction as the file registration, so files and
                # watermark commit or roll back together. A group whose timestamps are all
                # NULL still gets a row (NULL min/max, real count); only genuinely empty
                # batches are skipped. The watermark table lives in the
                # same catalog/schema and needs columns named like the group columns plus the
                # min-timestamp, max-timestamp and row-count columns. Malformed values (partial spec, blanks, typo'd watermark_*
                # keys) fail at startup, not per batch. group_columns is a comma-separated
                # string (a HOCON list is tolerated). NOT available for queues registered via
                # the dynamic SQLite provider — its registry does not store additional_parameters.
                # additional_parameters {
                #     watermark_table                = "ingest_watermark"
                #     watermark_timestamp_column     = "timestamp"     # SOURCE column; MIN and MAX both read it
                #     watermark_min_timestamp_column = "min_timestamp"
                #     watermark_max_timestamp_column = "max_timestamp"
                #     watermark_row_count_column     = "row_count"
                #     watermark_snapshot_id_column   = "min_commit_snapshot_id"   # required; BIGINT, lower bound on the commit snapshot
                #     watermark_group_columns        = "county,state"   # optional; empty = one global row per batch
                #     watermark_batch_id_column      = "batch_id"       # required; UUID (16 bytes, not 36 as text).
                #                                                      # The exact commit snapshot is appended as a
                #                                                      # correction row keyed by batch id, so read it
                #                                                      # as max(snapshot_id) GROUP BY batch_id. Add
                #                                                      # the column to the table first.
                #
                #     # Optional attribute type registry for THIS stream (see attribute_types
                #     # below). Unqualified, same catalog/schema as the target table, created on
                #     # first use. Omit it and this stream records nothing. Several streams may
                #     # name the same table and share it — their rows stay apart by the
                #     # ingestion_queue column — or each may name its own.
                #     attribute_types_table          = "otel_attribute_types"
                #
                #     # Optional: this stream's own cap on held mappings, for a stream legitimately
                #     # wider than attribute_types.max_entries_per_stream. Cannot exceed max_entries.
                #     attribute_types_max_entries    = 50000
                # }
            }
            {
                ingestion_queue = "traces"
                output_path     = "./otel-traces"
                partition_by    = []
                # DuckLake fields:
                # catalog = "my_catalog"
                # schema  = "main"
                # table   = "spans"
            }
            {
                ingestion_queue = "metrics"
                output_path     = "./otel-metrics"
                partition_by    = []
                # DuckLake fields:
                # catalog = "my_catalog"
                # schema  = "main"
                # table   = "metrics"
            }
        ]
    }

    # Authentication — only "jwt" is supported. Every request must carry a signed Bearer token.
    authentication = "jwt"

    # JWT token settings.
    jwt_token {
        # Set to false to skip signature verification — useful in development/testing
        # when tokens are issued by an external provider without sharing the secret key.
        # WARNING: disabling signature verification in production allows forged tokens.
        verify_signature = true
    }

    # Every OTLP export RPC must include the x-dd-ingestion-queue claim in the JWT.
    # The claim value must match one of the ingestion_queue values in ingestion_queue_table_mapping.
    # There is no default fallback — requests without the claim are rejected with INVALID_ARGUMENT.

    # Base64-encoded HMAC secret key. Required when authentication = "jwt".
    # Change this in production!
    secret_key = "Y2hhbmdlLW1lLWluLXByb2R1Y3Rpb24tdGhpcy1rZXktbXVzdC1iZS1hdC1sZWFzdC02NC1ieXRlcy1sb25nISE="

    # Optional: delegate login to an external HTTP service.
    # When set, Basic auth credentials are forwarded to this URL (POST with {username, password}).
    # The response must be a JSON object with accessToken and tokenType fields.
    # If not set, users are validated locally against the users list below.
    # When set it must be an absolute http(s) URL; anything else fails startup.
    # login_url = "http://localhost:8081/v1/login"

    # Users allowed to authenticate with username/password (Basic auth).
    # On successful login a JWT is generated and returned in the response Authorization header.
    # Subsequent requests should use: Authorization: Bearer <token>
    users = [
      { username = admin, password = admin }
    ]

    # JWT token expiration duration (e.g. 60m, 8h, 1d). Default: 1h
    # jwt_token.expiration = 1h

    # Service name reported in Micrometer metrics. Default: "open-telemetry-collector"
    # service_name = "my-collector"

    # Deprecated: use output_path within ingestion_task_factory_provider.ingestion_queue_table_mapping
    # log_ingestion    { output_path = "./otel-logs" }
    # trace_ingestion  { output_path = "./otel-traces" }
    # metric_ingestion { output_path = "./otel-metrics" }
}
