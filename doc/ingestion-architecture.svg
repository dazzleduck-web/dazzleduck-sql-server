<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 540" width="1020" height="540" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" role="img"
           aria-label="Clients POST batches into one of several ingestion queues on a server. Each queue accumulates a bucket until a size or delay threshold, then a single writer thread applies the transformation and runs a DuckDB COPY that writes partitioned Parquet files. The written files are registered in the DuckLake catalog in one transaction.">
        <rect x="0" y="0" width="1020" height="540" fill="#FFFFFF"></rect>
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#14202B"></path>
          </marker>
          <marker id="ar-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#0D7C86"></path>
          </marker>
        </defs>

        <!-- ================= server enclosure ================= -->
        <rect x="230" y="36" width="430" height="456" rx="4"
              fill="#EDF2F5" stroke="#14202B" stroke-opacity="0.28"></rect>
        <text x="248" y="62" font-family="IBM Plex Mono, monospace" font-size="10"
              letter-spacing="1.4" fill="#14202B" fill-opacity="0.55">SERVER</text>

        <!-- ================= lane 1 : logs ================= -->
        <rect x="34" y="90" width="112" height="56" rx="3" fill="#FFFFFF" stroke="#14202B" stroke-opacity="0.2"></rect>
        <rect x="29" y="85" width="112" height="56" rx="3" fill="#FFFFFF" stroke="#14202B" stroke-opacity="0.3"></rect>
        <rect x="24" y="80" width="112" height="56" rx="3" fill="#FFFFFF" stroke="#14202B" stroke-opacity="0.75"></rect>
        <text x="80" y="104" text-anchor="middle" font-size="13" fill="#14202B">clients</text>
        <text x="80" y="121" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#14202B" fill-opacity="0.6">many producers</text>

        <line x1="146" y1="108" x2="222" y2="108" stroke="#14202B" stroke-width="1.4" marker-end="url(#ar)"></line>
        <text x="184" y="100" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#14202B" fill-opacity="0.65">batches</text>

        <rect x="252" y="76" width="164" height="64" rx="3" fill="#FFFFFF" stroke="#14202B" stroke-opacity="0.75"></rect>
        <text x="334" y="101" text-anchor="middle" font-size="13" fill="#14202B">queue &#8220;logs&#8221;</text>
        <text x="334" y="118" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#14202B" fill-opacity="0.6">bucket fills</text>

        <line x1="416" y1="108" x2="444" y2="108" stroke="#14202B" stroke-width="1.4" marker-end="url(#ar)"></line>

        <rect x="448" y="76" width="188" height="64" rx="3" fill="#FFFFFF" stroke="#14202B" stroke-opacity="0.75"></rect>
        <text x="542" y="101" text-anchor="middle" font-size="13" fill="#14202B">writer thread</text>
        <text x="542" y="118" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#14202B" fill-opacity="0.6">transform &#8594; COPY</text>

        <!-- ================= lane 2 : traces ================= -->
        <rect x="34" y="230" width="112" height="56" rx="3" fill="#FFFFFF" stroke="#14202B" stroke-opacity="0.2"></rect>
        <rect x="29" y="225" width="112" height="56" rx="3" fill="#FFFFFF" stroke="#14202B" stroke-opacity="0.3"></rect>
        <rect x="24" y="220" width="112" height="56" rx="3" fill="#FFFFFF" stroke="#14202B" stroke-opacity="0.75"></rect>
        <text x="80" y="244" text-anchor="middle" font-size="13" fill="#14202B">clients</text>
        <text x="80" y="261" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#14202B" fill-opacity="0.6">many producers</text>

        <line x1="146" y1="248" x2="222" y2="248" stroke="#14202B" stroke-width="1.4" marker-end="url(#ar)"></line>
        <text x="184" y="240" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#14202B" fill-opacity="0.65">batches</text>

        <rect x="252" y="216" width="164" height="64" rx="3" fill="#FFFFFF" stroke="#14202B" stroke-opacity="0.75"></rect>
        <text x="334" y="241" text-anchor="middle" font-size="13" fill="#14202B">queue &#8220;traces&#8221;</text>
        <text x="334" y="258" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#14202B" fill-opacity="0.6">bucket fills</text>

        <line x1="416" y1="248" x2="444" y2="248" stroke="#14202B" stroke-width="1.4" marker-end="url(#ar)"></line>

        <rect x="448" y="216" width="188" height="64" rx="3" fill="#FFFFFF" stroke="#14202B" stroke-opacity="0.75"></rect>
        <text x="542" y="241" text-anchor="middle" font-size="13" fill="#14202B">writer thread</text>
        <text x="542" y="258" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#14202B" fill-opacity="0.6">transform &#8594; COPY</text>

        <!-- ================= lane 3 : metrics ================= -->
        <rect x="34" y="370" width="112" height="56" rx="3" fill="#FFFFFF" stroke="#14202B" stroke-opacity="0.2"></rect>
        <rect x="29" y="365" width="112" height="56" rx="3" fill="#FFFFFF" stroke="#14202B" stroke-opacity="0.3"></rect>
        <rect x="24" y="360" width="112" height="56" rx="3" fill="#FFFFFF" stroke="#14202B" stroke-opacity="0.75"></rect>
        <text x="80" y="384" text-anchor="middle" font-size="13" fill="#14202B">clients</text>
        <text x="80" y="401" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#14202B" fill-opacity="0.6">many producers</text>

        <line x1="146" y1="388" x2="222" y2="388" stroke="#14202B" stroke-width="1.4" marker-end="url(#ar)"></line>
        <text x="184" y="380" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#14202B" fill-opacity="0.65">batches</text>

        <rect x="252" y="356" width="164" height="64" rx="3" fill="#FFFFFF" stroke="#14202B" stroke-opacity="0.75"></rect>
        <text x="334" y="381" text-anchor="middle" font-size="13" fill="#14202B">queue &#8220;metrics&#8221;</text>
        <text x="334" y="398" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#14202B" fill-opacity="0.6">bucket fills</text>

        <line x1="416" y1="388" x2="444" y2="388" stroke="#14202B" stroke-width="1.4" marker-end="url(#ar)"></line>

        <rect x="448" y="356" width="188" height="64" rx="3" fill="#FFFFFF" stroke="#14202B" stroke-opacity="0.75"></rect>
        <text x="542" y="381" text-anchor="middle" font-size="13" fill="#14202B">writer thread</text>
        <text x="542" y="398" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#14202B" fill-opacity="0.6">transform &#8594; COPY</text>

        <!-- threshold annotation under the lanes -->
        <text x="334" y="452" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#14202B" fill-opacity="0.6">flush on min_bucket_size or max_delay_ms</text>
        <text x="542" y="452" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#14202B" fill-opacity="0.6">exactly one writer per queue</text>

        <!-- ================= server to lake ================= -->
        <path d="M 660 108 C 726 108, 736 214, 796 216" fill="none" stroke="#14202B" stroke-width="1.4" marker-end="url(#ar)"></path>
        <path d="M 660 248 L 796 234" fill="none" stroke="#14202B" stroke-width="1.4" marker-end="url(#ar)"></path>
        <path d="M 660 388 C 726 388, 736 254, 796 252" fill="none" stroke="#14202B" stroke-width="1.4" marker-end="url(#ar)"></path>
        <text x="726" y="200" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#14202B" fill-opacity="0.65">COPY</text>

        <!-- ================= lake enclosure ================= -->
        <rect x="796" y="150" width="212" height="300" rx="4"
              fill="#EDF2F5" stroke="#14202B" stroke-opacity="0.28"></rect>
        <text x="814" y="176" font-family="IBM Plex Mono, monospace" font-size="10"
              letter-spacing="1.4" fill="#14202B" fill-opacity="0.55">DUCKLAKE</text>

        <rect x="814" y="200" width="176" height="60" rx="3" fill="#FFFFFF" stroke="#14202B" stroke-opacity="0.75"></rect>
        <text x="902" y="223" text-anchor="middle" font-size="12.5" fill="#14202B">Parquet data files</text>
        <text x="902" y="240" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#14202B" fill-opacity="0.6">partitioned</text>

        <!-- the commit: the one thing that carries the accent -->
        <line x1="838" y1="260" x2="838" y2="330" stroke="#0D7C86" stroke-width="1.8" marker-end="url(#ar-acc)"></line>
        <text x="854" y="284" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#14202B" fill-opacity="0.8">add_data_files</text>
        <text x="854" y="301" font-family="IBM Plex Mono, monospace" font-size="9" letter-spacing="0.9" fill="#0D7C86">ONE TRANSACTION</text>

        <rect x="814" y="334" width="176" height="66" rx="3" fill="#FFFFFF" stroke="#0D7C86" stroke-width="1.4"></rect>
        <text x="902" y="360" text-anchor="middle" font-size="12.5" fill="#14202B">catalog</text>
        <text x="902" y="377" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#14202B" fill-opacity="0.6">metadata</text>

        <text x="902" y="428" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#14202B" fill-opacity="0.6">one table per queue</text>
      </svg>
