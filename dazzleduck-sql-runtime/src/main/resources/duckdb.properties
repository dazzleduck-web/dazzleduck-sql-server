# Read by io.dazzleduck.sql.commons.ConnectionPool when it creates the shared DuckDB instance.
#
# The images bake in the patched DuckLake extension (ducklake.patch.release in the parent pom; see
# dazzleduck-sql-ducklake-compactor/DUCKLAKE_PATCH.md), which isn't signed with DuckDB Labs' key.
# allow_unsigned_extensions cannot be set with a `SET` statement once the instance is running, so
# it is a connection property here. Signed extensions (stock builds outside the images) load as before.
#
# It also lets a COMPLETE-mode client `LOAD` an unsigned extension file from a path it can read.
# The other access modes only permit SELECT, which cannot load an extension.
allow_unsigned_extensions=true
